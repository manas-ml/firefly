# Firefly: Telegram-controlled personal agent.
#
# Networks (all internal except the *egress ones):
#   sandbox_net     agent <-> sandbox   (sandbox has no other route anywhere)
#   db_net          agent <-> postgres  (sandbox and browser can't reach the database)
#   browser_net     agent <-> browser
#   egress          agent -> internet   (Telegram, OpenRouter, MCP servers)
#   browser_egress  browser -> internet (its own; the browser also refuses private addresses)
# Set SANDBOX_INTERNET=true in .env and use `make up` to give the sandbox
# internet access (adds docker-compose.internet.yml).
#
# Nothing is published except the health endpoint, on 127.0.0.1 only.
# The Docker socket is never mounted.

name: firefly

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: firefly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: firefly
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - db_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firefly -d firefly"]
      interval: 10s
      timeout: 5s
      retries: 10

  sandbox:
    <<: *hardening
    image: firefly-sandbox:latest
    build:
      context: .
      dockerfile: docker/sandbox.Dockerfile
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?set SANDBOX_TOKEN in .env}
      TZ: ${TZ:-America/Toronto}
    volumes:
      - workspace:/workspace
    networks:
      - sandbox_net
    pids_limit: 512
    mem_limit: 2g
    cpus: 2

  browser:
    <<: *hardening
    image: firefly-browser:latest
    build:
      context: .
      dockerfile: docker/browser.Dockerfile
    environment:
      BROWSER_TOKEN: ${BROWSER_TOKEN:?set BROWSER_TOKEN in .env}
      TZ: ${TZ:-America/Toronto}
    volumes:
      - browser_profile:/profile
    networks:
      - browser_net
      - browser_egress
    shm_size: 1gb
    pids_limit: 512
    mem_limit: 2g

  agent:
    <<: *hardening
    image: firefly-agent:latest
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://firefly:${POSTGRES_PASSWORD}@postgres:5432/firefly
      SANDBOX_URL: http://sandbox:7070
      BROWSER_URL: http://browser:7071
      VAULT_KEY_FILE: /run/secrets/vault_master_key
      MAC_BRIDGE_TOKEN_FILE: /run/secrets/mac_bridge_token
      DATA_DIR: /data
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8080"
    volumes:
      - sessions:/data
      - memory:/memory
      - ./config/policy.yaml:/app/config/policy.yaml:ro
      - ./config/mcp.yaml:/app/config/mcp.yaml:ro
    secrets:
      - vault_master_key
      - mac_bridge_token
    # Lets the agent reach the optional Mac bridge (Docker Desktop/OrbStack provide this name already).
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:${HEALTH_PORT:-8080}:8080"
    networks:
      - sandbox_net
      - db_net
      - browser_net
      - egress
    depends_on:
      postgres:
        condition: service_healthy
      sandbox:
        condition: service_healthy
      browser:
        condition: service_healthy
    mem_limit: 1g

  # Nightly pg_dump plus tarballs of the sessions, memory and workspace volumes,
  # kept BACKUP_KEEP_DAYS days in BACKUP_DIR on the host (e.g. a folder synced to
  # iCloud, or an external drive). The vault master key is NOT included.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/backup-loop.sh"]
    environment:
      PGHOST: postgres
      PGUSER: firefly
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: firefly
      BACKUP_TIME: ${BACKUP_TIME:-03:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-America/Toronto}
    volumes:
      - ./scripts:/scripts:ro
      - sessions:/volumes/sessions:ro
      - memory:/volumes/memory:ro
      - workspace:/volumes/workspace:ro
      - ${BACKUP_DIR:-./backups}:/backups
    networks:
      - db_net
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE   # read files owned by the agent/sandbox users, write to the backup folder

networks:
  sandbox_net:
    internal: true
  db_net:
    internal: true
  browser_net:
    internal: true
  egress: {}
  browser_egress: {}

# The vault master key: generated once (make secrets / install.sh), never in .env.
secrets:
  vault_master_key:
    file: ./secrets/vault_master_key
  # Empty unless bridge/install.sh was run on the Mac.
  mac_bridge_token:
    file: ./secrets/mac_bridge_token

volumes:
  pgdata:
  sessions:
  workspace:
  memory:
  browser_profile:
